<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Placement Calendar — PlaceTrack</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="app-shell"><aside class="sidebar"><a href="index.html" class="brand"><span class="brand-mark">PT</span> PlaceTrack</a><nav class="side-nav"><div class="side-label">Menu</div><a href="dashboard.html" class="side-link">🏠 Dashboard</a><a href="opportunities.html" class="side-link">🏢 Opportunities</a><a href="applications.html" class="side-link">📋 My Applications</a><a href="interviews.html" class="side-link">🎤 Tests &amp; Interviews</a><a href="preparation.html" class="side-link">📈 Preparation</a><a href="study-hub.html" class="side-link">📚 Study Hub</a><a href="calendar.html" class="side-link">📅 Calendar</a><a href="ai-assistant.html" class="side-link">🤖 AI Assistant</a><a href="profile.html" class="side-link">👤 Profile</a></nav><div class="sidebar-foot"><div class="side-user"><div class="side-avatar">S</div><div><div class="side-user-name" data-user-name>Student</div><div class="side-user-role">Placement Calendar</div></div></div><button class="btn btn-outline btn-sm btn-block" data-logout>Log Out</button></div></aside>
<div class="main-area"><div class="topbar"><div class="flex items-center gap-12"><button class="menu-btn">☰</button><h1>Placement Calendar</h1></div><button class="btn btn-accent btn-sm" id="enable-notifications">🔔 Enable Notifications</button></div><div class="page-body"><div class="calendar-layout"><div class="panel"><div class="panel-head"><button class="btn btn-outline btn-sm" id="prev-month">←</button><h2 id="calendar-title" style="margin:0"></h2><button class="btn btn-outline btn-sm" id="next-month">→</button></div><div class="calendar-grid weekdays"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div><div id="calendar-grid" class="calendar-grid"></div></div><div class="panel"><div class="panel-head"><h2>Add Reminder</h2></div><div class="panel-body"><form id="event-form"><div class="field"><label>Title</label><input id="event-title" required placeholder="Java practice"></div><div class="field"><label>Date</label><input id="event-date" type="date" required></div><div class="field"><label>Time</label><input id="event-time" type="time" required></div><div class="field"><label>Category</label><select id="event-category"><option>Learning</option><option>Interview</option><option>Application</option><option>Assessment</option><option>Other</option></select></div><button class="btn btn-primary btn-block" type="submit">Save Reminder</button></form></div><div class="panel-head"><h2>Upcoming</h2></div><div class="panel-body" id="upcoming-events"></div></div></div></div></div></div>
<script src="js/main.js"></script><script src="js/calendar.js"></script></body></html>
