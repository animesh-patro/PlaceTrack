<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tests &amp; Interviews — PlaceTrack</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <a href="index.html" class="brand"><span class="brand-mark">PT</span> PlaceTrack</a>
    <nav class="side-nav">
      <div class="side-label">Menu</div>
      <a href="dashboard.html" class="side-link"><span class="ic">🏠</span> Dashboard</a>
      <a href="opportunities.html" class="side-link"><span class="ic">🏢</span> Opportunities</a>
      <a href="applications.html" class="side-link"><span class="ic">📋</span> My Applications</a>
      <a href="interviews.html" class="side-link"><span class="ic">🎤</span> Tests &amp; Interviews</a>
      <a href="preparation.html" class="side-link"><span class="ic">📈</span> Preparation</a>
      <a href="study-hub.html" class="side-link"><span class="ic">📚</span> Study Hub</a><a href="calendar.html" class="side-link"><span class="ic">📅</span> Calendar</a><a href="ai-assistant.html" class="side-link"><span class="ic">🤖</span> AI Assistant</a><a href="profile.html" class="side-link"><span class="ic">👤</span> Profile</a>
    </nav>
    <div class="sidebar-foot">
      <div class="side-user">
        <div class="side-avatar">S</div>
        <div>
          <div class="side-user-name" data-user-name>Student</div>
          <div class="side-user-role">3rd Year · CSE</div>
        </div>
      </div>
      <button class="btn btn-outline btn-sm btn-block" data-logout>Log Out</button>
    </div>
  </aside>

  <div class="main-area">
    <div class="topbar">
      <div class="flex items-center gap-12">
        <button class="menu-btn" aria-label="Toggle sidebar">☰</button>
        <h1>Tests &amp; Interviews</h1>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-accent btn-sm" data-modal-open="event-modal">+ Add Event</button>
      </div>
    </div>

    <div class="page-body">
      <div class="two-col">
        <div class="panel">
          <div class="panel-head"><h2>Upcoming Tests</h2></div>
          <div class="panel-body" id="interviews-tests"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Upcoming Interviews</h2></div>
          <div class="panel-body" id="interviews-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="event-modal">
  <div class="modal-box">
    <button class="modal-close" data-modal-close>×</button>
    <h3>Add Event</h3>
    <p class="text-muted" style="margin-bottom:16px;">Log a test or interview so it shows up on your dashboard.</p>
    <form id="add-event-form" novalidate>
      <div class="field">
        <label for="ev-company">Company</label>
        <input type="text" id="ev-company" placeholder="e.g. Microsoft" required>
      </div>
      <div class="field">
        <label for="ev-type">Event Type</label>
        <select id="ev-type">
          <option>Online Assessment</option>
          <option>Technical Interview</option>
          <option>HR Interview</option>
        </select>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="ev-date">Date</label>
          <input type="date" id="ev-date" required>
        </div>
        <div class="field">
          <label for="ev-time">Time</label>
          <input type="text" id="ev-time" placeholder="e.g. 10:00 AM">
        </div>
      </div>
      <div class="field">
        <label for="ev-notes">Notes</label>
        <textarea id="ev-notes" placeholder="Anything to remember for this round..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Save Event</button>
    </form>
  </div>
</div>

<script src="js/main.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
